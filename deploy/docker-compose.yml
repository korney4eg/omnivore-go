x-postgres:
  &postgres-common
  image: "ankane/pgvector:v0.5.1"
  user: postgres
  healthcheck:
    test: "exit 0"
    interval: 2s
    timeout: 12s
    retries: 3
x-omnivore-go-image:
  &omnivore-go-image
  image: "korney4eg/omnivore-content-fetcher:20260306"
x-omnivore-go-build:
  &omnivore-go-build
  build:
    context: ..
    dockerfile: Dockerfile

services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    container_name: "omnivore-nginx"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      omnivore-api:
        condition: service_healthy
      omnivore-web:
        condition: service_started
    networks:
      - default

  postgres:
    <<: *postgres-common
    container_name: "omnivore-postgres"
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env

  bootstrap:
    <<: *omnivore-go-build
    container_name: "omnivore-bootstrap"
    entrypoint: ["/bin/sh", "/app/bootstrap-db.sh"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  omnivore-api:
    <<: *omnivore-go-image
    container_name: "omnivore-api"
    command: ["./omnivore", "server", "api"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 0.0.0.0 8080 || exit 1"]
      interval: 15s
      timeout: 90s
      retries: 6
    env_file:
      - .env
    extra_hosts:
      - "omnivore-testsite:host-gateway"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      - default

  queue-processor:
    <<: *omnivore-go-image
    container_name: "omnivore-queue-processor"
    command: ["./omnivore", "server", "queue-processor"]
    env_file:
      - .env
    extra_hosts:
      - "omnivore-testsite:host-gateway"
    depends_on:
      omnivore-api:
        condition: service_started
    networks:
      - default

  omnivore-web:
    image: "ghcr.io/omnivore-app/sh-web:latest"
    container_name: "omnivore-web"
    env_file:
      - .env
    depends_on:
      omnivore-api:
        condition: service_healthy

  omnivore-image-proxy:
    image: "ghcr.io/omnivore-app/sh-image-proxy:latest"
    container_name: "omnivore-image-proxy"
    env_file:
      - .env

  content-fetch:
    <<: *omnivore-go-image
    container_name: "omnivore-content-fetch"
    environment:
      - USE_FIREFOX=true
    command: ["./omnivore", "server", "content-fetcher"]
    env_file:
      - .env
    extra_hosts:
      - "omnivore-testsite:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      omnivore-api:
        condition: service_healthy

  redis:
    image: "redis:7.2.4"
    container_name: "omnivore-redis"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 1s
    environment:
      - "MINIO_ACCESS_KEY=minio"
      - "MINIO_SECRET_KEY=miniominio"
    command: server /data
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    environment:
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniominio
      - BUCKET_NAME=omnivore
      - ENDPOINT=http://minio:9000
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - minio
    entrypoint: >
      /bin/bash -c "
      sleep 5;
      until (/usr/bin/mc alias set myminio http://minio:9000 minio miniominio) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/omnivore;
      /usr/bin/mc anonymous set public myminio/omnivore;
      exit 0;
      "
  mail-watch-server:
    image: "ghcr.io/omnivore-app/sh-local-mail-watcher:latest"
    container_name: "omnivore-mail-watch-server"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data:
  minio_data:
  pgdata:

networks:
  default:
