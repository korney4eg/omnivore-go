events {}

http {
    sendfile on;
    keepalive_timeout 60;
    client_max_body_size 100M;

    server {
        listen 80;

        # Frontend auth and save routes handled by Next.js
        location /api/client/auth {
            proxy_pass http://omnivore-web:8080;
        }

        location /api/save {
            proxy_pass http://omnivore-web:8080;
        }

        # Backend API
        location /api {
            proxy_pass http://omnivore-api:8080;
        }

        # MinIO bucket
        location /bucket {
            rewrite ^/bucket/(.*)$ /$1 break;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            chunked_transfer_encoding off;
            proxy_pass http://minio:9000;
        }

        # Image proxy
        location /images {
            rewrite ^/images/(.*)$ /$1 break;
            proxy_pass http://omnivore-image-proxy:8080;
        }

        # Frontend
        location / {
            proxy_pass http://omnivore-web:8080;
        }
    }
}
