version: '3'
x-postgres:
  &postgres-common
  image: "ankane/pgvector:v0.5.1"
  user: postgres
  healthcheck:
    test: "exit 0"
    interval: 2s
    timeout: 12s
    retries: 3

services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "81:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      omnivore-api:
        condition: service_healthy
      omnivore-web:
        condition: service_started
    networks:
      - default

  postgres:
    <<: *postgres-common
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env

  migrate:
    image: "ghcr.io/omnivore-app/sh-migrate:latest"
    command: '/bin/bash /setup_db.bash'
    volumes:
      - ../setup_db.bash:/setup_db.bash
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  omnivore-api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    environment:
      - PORT=8080
      - API_ENV=dev
    env_file:
      - .env
    extra_hosts:
      - "omnivore-testsite:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - default

  queue-processor:
    build:
      context: ..
      dockerfile: docker/queue-processor.Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "omnivore-testsite:host-gateway"
    depends_on:
      omnivore-api:
        condition: service_started
    networks:
      - default

  omnivore-web:
    image: "ghcr.io/omnivore-app/sh-web:latest"
    env_file:
      - .env
    depends_on:
      omnivore-api:
        condition: service_healthy

  omnivore-image-proxy:
    image: "ghcr.io/omnivore-app/sh-image-proxy:latest"
    env_file:
      - .env

  content-fetch:
    build:
      context: ..
      dockerfile: docker/content-fetcher.Dockerfile
    environment:
      - USE_FIREFOX=true
    env_file:
      - .env
    extra_hosts:
      - "omnivore-testsite:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      omnivore-api:
        condition: service_healthy

  redis:
    image: "redis:7.2.4"
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 1s
    environment:
      - "MINIO_ACCESS_KEY=minio"
      - "MINIO_SECRET_KEY=miniominio"
    command: server /data
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    environment:
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=miniominio
      - BUCKET_NAME=omnivore
      - ENDPOINT=http://minio:9000
      - AWS_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - minio
    entrypoint: >
      /bin/bash -c "
      sleep 5;
      until (/usr/bin/mc alias set myminio http://minio:9000 minio miniominio) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/omnivore;
      /usr/bin/mc anonymous set public myminio/omnivore;
      exit 0;
      "

  mail-watch-server:
    image: "ghcr.io/omnivore-app/sh-local-mail-watcher:latest"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  minio_data:
  pgdata:

networks:
  default:
